<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - explow ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0616;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Фоновые свечения */
        .glow-left {
            position: fixed;
            bottom: 10vh;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(92, 51, 212, 0.4) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
        }
        .glow-right {
            position: fixed;
            bottom: 10vh;
            right: -5%;
            width: 45vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(137, 75, 255, 0.3) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
        }

        /* Точки на фоне */
        .bg-dots {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
        }

        /* Навигация (Шапка) */
        .navbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1300px;
            display: flex;
            justify-content: flex-start;
            padding: 20px 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.5px;
            color: #fff;
            text-decoration: none;
        }
        .logo img {
            width: 24px;
            height: 24px;
            display: block;
        }

        /* Форма */
        .auth-container {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 15, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            backdrop-filter: blur(12px) saturate(120%);
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .auth-container h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .auth-container p {
            font-size: 14px;
            color: #9b9b9b;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #b0b0b0;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .form-input:focus {
            border-color: #8A55F7;
            background: rgba(0, 0, 0, 0.5);
        }
        .form-input::placeholder {
            color: #5a5a5a;
        }

        /* Обновленная кнопка с белой обводкой */
        .btn-primary {
            width: 100%;
            border: none;
            background: transparent;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            border: 2px solid #ffffff;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #ffffff;
            color: #000000;
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #9b9b9b;
        }
        .auth-footer a {
            color: #8A55F7;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="bg-dots"></div>
    <div class="glow-left"></div>
    <div class="glow-right"></div>

    <nav class="navbar">
        <a href="/" class="logo">
            <img src="https://raw.githubusercontent.com/DavidHDev/react-bits/d26ed7a476148f1253cca3f5bc9f679fda53e1f5/src/assets/logos/react-bits-logo-small.svg" alt="explow ai logo">
            explow ai
        </a>
    </nav>

    <div class="auth-container">
        <h2>Welcome</h2>
        <p>Enter your email and password to sign in or create an account.</p>

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button class="btn-primary" id="auth-btn">Continue →</button>

        <div class="auth-footer">
            By continuing, you agree to our <a href="#">Terms</a>.
        </div>
    </div>

    <script>
        document.getElementById('auth-btn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // 1. Проверяем заполненность email
            if (!email) {
                alert('Пожалуйста, введите Email');
                return;
            }

            // 2. ✅ Строгая проверка: Без пароля вход невозможен
            if (!password) {
                alert('Пожалуйста, введите пароль. Без пароля вход невозможен.');
                return;
            }

            // 3. Формируем данные пользователя
            const name = email.split('@')[0];
            const avatarLetter = name.charAt(0).toUpperCase();
            const userData = { 
                username: name, 
                email: email, 
                password: password, 
                avatar: avatarLetter, 
                language: 'en' 
            };

            // 4. ✅ Сохраняем данные регистрации в браузер (не пропадают при перезагрузке)
            localStorage.setItem('explow_user', JSON.stringify(userData));

            // 5. Перенаправляем в чат
            window.location.href = '/chat.html';
        });
    </script>
</body>
</html>
