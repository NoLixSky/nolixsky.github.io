<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - explow ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #0b0616;
            /* Добавлен такой же фон, как на главной */
            background-image: url('https://i.pinimg.com/1200x/b3/c2/04/b3c20459aaf6928d79ec2b712b139454.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Тёмная вуаль */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 6, 22, 0.55);
            pointer-events: none;
            z-index: 0;
        }

        /* Точки на фоне */
        .bg-dots {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
        }

        .navbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1300px;
            display: flex;
            justify-content: flex-start;
            padding: 20px 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
        }
        .logo img {
            width: 24px;
            height: 24px;
            display: block;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(12px) saturate(120%);
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .auth-container h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .auth-container p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 14px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; font-size: 15px; outline: none; transition: border-color 0.2s, background 0.2s; }
        .form-input:focus { border-color: rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.4); }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.3); }

        .btn-primary {
            width: 100%;
            border: none;
            background: transparent;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            border: 2px solid #ffffff;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #ffffff;
            color: #000000;
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        .auth-footer a { color: #ffffff; text-decoration: none; font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .navbar {
                top: 10px;
                padding: 10px 15px;
            }
            .auth-container {
                padding: 24px 20px;
                margin: 0 15px;
            }
            .auth-container h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-dots"></div>

    <nav class="navbar">
        <a href="/" class="logo">
            <img src="https://raw.githubusercontent.com/DavidHDev/react-bits/d26ed7a476148f1253cca3f5bc9f679fda53e1f5/src/assets/logos/react-bits-logo-small.svg" alt="explow ai logo">
            explow ai
        </a>
    </nav>

    <div class="auth-container">
        <h2>Добро пожаловать</h2>
        <p>Введите адрес электронной почты и пароль, чтобы войти или создать учетную запись.</p>

        <div class="form-group">
            <label for="email">Адрес электронной почты</label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button class="btn-primary" id="auth-btn">Продолжить →</button>

        <div class="auth-footer">
            Продолжая, вы соглашаетесь с нашими <a href="#">Условиями</a>.
        </div>
    </div>

    <script>
        document.getElementById('auth-btn').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email) {
                alert('Пожалуйста, введите адрес электронной почты');
                return;
            }
            if (!password) {
                alert('Пожалуйста, введите пароль. Без пароля вход невозможен.');
                return;
            }

            const name = email.split('@')[0];
            const avatarLetter = name.charAt(0).toUpperCase();
            const userData = { 
                username: name, 
                email: email, 
                password: password, 
                avatar: avatarLetter, 
                language: 'ru' 
            };

            localStorage.setItem('explow_user', JSON.stringify(userData));
            window.location.href = '/chat.html';
        });
    </script>
</body>
</html>
