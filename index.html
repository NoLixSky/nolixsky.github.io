<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- 🚀 НОВОЕ: Подключаем библиотеку для подсветки кода (Тема Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-title">explow</div>
        <button class="new-chat-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14" />
            </svg>
            Новый чат
        </button>
        <div class="chat-history" id="chat-history"></div>
    </div>

    <div class="main-content">
        <div class="header-area">
            <div class="brand-name">explow</div>
        </div>
        <div class="messages-container" id="messages-container"></div>
        <div class="input-area">
            <input type="text" class="input-field" id="input-field" placeholder="Напишите ваш запрос...">
            <button class="send-btn" id="send-btn">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 4l1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- 🚀 НОВОЕ: Подгружаем скрипт библиотеки подсветки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</body>
</html>
