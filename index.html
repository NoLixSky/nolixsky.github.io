<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили, которых не было в style.css, но нужны для модалок */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 30px 35px;
            min-width: 320px;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            text-align: center;
        }
        .modal-title { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 8px; }
        .modal-desc { font-size: 14px; color: #aaa; margin-bottom: 24px; line-height: 1.5; }
        
        .modal-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            background: #1c1c1c;
            border: 1px solid #333;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }
        .modal-input:focus { border-color: #555; }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn.cancel { background: #2a2a2a; color: #aaa; }
        .modal-btn.cancel:hover { background: #333; color: #fff; }
        .modal-btn.danger { background: #d32f2f; color: #fff; }
        .modal-btn.danger:hover { opacity: 0.8; }
        .modal-btn.primary { background: #ffffff; color: #000; }
        .modal-btn.primary:hover { opacity: 0.8; }

        /* 📝 УМЕНЬШАЕМ ДЛИНУ ОКНА ВВОДА */
        .input-area {
            width: 100%;
            max-width: 560px !important; /* Было 720px */
            margin: 0 auto;
            background-color: #1c1c1c;
            border-radius: 20px;
            padding: 8px 8px 8px 16px;
            display: flex;
            align-items: center;
            border: 1px solid #2a2a2a;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">explow</div>
        <button class="new-chat-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" /></svg>
            Новый чат
        </button>
        <div class="chat-history" id="chat-history"></div>
        <div class="sidebar-footer">
            <div class="auth-container" id="auth-container">
                <button class="auth-btn" id="login-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    Вход
                </button>
                <div class="user-profile" id="user-profile">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div class="user-name" id="user-name">User</div>
                    <div class="profile-dots-wrapper" id="profile-dots">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></svg>
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="dropdown-item" id="logout-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                Выйти
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="main-chat-view">
            <div class="header-area" id="chat-header">
                <div class="brand-name">explow</div>
            </div>
            <div class="messages-container" id="messages-container">
                <div class="greeting-wrapper">
                    <div class="greeting-text">Чем я могу вам помочь?</div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" class="input-field" id="input-field" placeholder="Напишите ваш запрос...">
                <button class="send-btn" id="send-btn">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </button>
            </div>
        </div>

        <div id="auth-screen">
            <div class="auth-logo">explow</div>
            <div class="auth-box">
                <input type="email" class="auth-input" id="auth-email" placeholder="Email">
                <input type="password" class="auth-input" id="auth-pass" placeholder="Password">
                <button class="auth-submit-btn" id="auth-submit-btn">Войти</button>
            </div>
        </div>
    </div>

    <!-- ==================== МОДАЛЬНЫЕ ОКНА ==================== -->
    <div class="modal-overlay" id="modal-overlay">
        
        <!-- Окно выхода -->
        <div class="modal-box" id="modal-logout">
            <div class="modal-title">Выход из аккаунта</div>
            <div class="modal-desc">Вы действительно хотите выйти?</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modal-logout-cancel">Отмена</button>
                <button class="modal-btn danger" id="modal-logout-confirm">Выйти</button>
            </div>
        </div>

        <!-- Окно удаления чата -->
        <div class="modal-box" id="modal-delete">
            <div class="modal-title">Удалить чат</div>
            <div class="modal-desc">Вы действительно хотите удалить этот чат? Восстановить его будет невозможно.</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modal-delete-cancel">Отмена</button>
                <button class="modal-btn danger" id="modal-delete-confirm">Удалить</button>
            </div>
        </div>

        <!-- Окно переименования чата -->
        <div class="modal-box" id="modal-rename">
            <div class="modal-title">Переименовать чат</div>
            <input type="text" class="modal-input" id="modal-rename-input" placeholder="Введите новое название...">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modal-rename-cancel">Отмена</button>
                <button class="modal-btn primary" id="modal-rename-confirm">Сохранить</button>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
