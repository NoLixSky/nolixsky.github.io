<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0616;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .glow-left {
            position: fixed;
            bottom: 10vh;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(92, 51, 212, 0.4) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
        }
        
        .glow-right {
            position: fixed;
            bottom: 10vh;
            right: -5%;
            width: 45vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(137, 75, 255, 0.3) 0%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
        }

        .bg-dots {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
        }

        #root {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .navbar-left {
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.5px;
            color: #fff;
            text-decoration: none;
        }

        .logo img {
            width: 24px;
            height: 24px;
            display: block;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: opacity 0.2s, background 0.2s;
        }

        .btn-primary {
            background: #8A55F7;
            color: #fff;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-outline {
            background: #25202e;
            color: #b0b0b0;
        }

        .btn-outline:hover { background: #322b3d; color: #fff; }

        /* Hero Section */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px 30px;
            max-width: 1300px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            position: relative;
        }

        .hero-content {
            max-width: 50%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .badges {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-new {
            background: #8A55F7;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 5px 12px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-link {
            color: #b0b0b0;
            font-size: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-link:hover { color: #fff; }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: #fff;
            white-space: pre-wrap; 
        }

        .hero p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #9b9b9b;
            max-width: 480px;
        }

        .btn-browse {
            background: #8A55F7;
            color: #fff;
            font-size: 16px;
            padding: 12px 28px;
            border-radius: 8px;
            width: fit-content;
            font-weight: 500;
        }

        .code-wrapper {
            width: 45%;
            background: rgba(20, 15, 30, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            backdrop-filter: blur(24px) saturate(120%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .code-header {
            background: rgba(30, 25, 40, 0.25);
            padding: 8px 16px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .code-controls {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .code-body {
            padding: 24px;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .kw { color: #c678dd; font-weight: 500; }
        .str { color: #98c379; }
        .func { color: #61afef; }
        .var { color: #e5c07b; }
        .prop { color: #abb2bf; }
        .equal { color: #abb2bf; }
        .val { color: #56b6c2; }

        .code-indent-1 { padding-left: 16px; }
        .code-indent-2 { padding-left: 32px; }
        .code-indent-3 { padding-left: 48px; }

        .code-footer {
            padding: 8px 16px;
            text-align: right;
            font-size: 10px;
            color: #5a5a5a;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .features-grid {
            display: flex;
            gap: 24px;
            max-width: 1300px;
            margin: 30px auto 80px auto;
            padding: 0 30px;
            width: 100%;
        }

        .feature-card {
            flex: 1;
            background: rgba(20, 15, 30, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(4px);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .editor-dots {
            display: flex;
            gap: 6px;
        }
        .editor-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a4a4a;
        }
        .editor-header-label {
            font-size: 13px;
            color: #a0a0a0;
            font-weight: 500;
        }

        .editor-prompt {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            padding: 10px 14px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .editor-prompt span:first-child {
            color: #7f7f7f;
            margin-right: 10px;
        }

        .editor-code-block {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #c5c5c5;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .editor-line {
            display: flex;
            gap: 14px;
        }
        .editor-line-num {
            color: #4a4a4a;
            min-width: 16px;
            text-align: right;
            user-select: none;
        }
        
        .editor-indent-1 { padding-left: 8px; }
        .editor-indent-2 { padding-left: 16px; }

        .ai-ready-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .ai-ready-section h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }
        .ai-ready-section p {
            font-size: 14px;
            color: #9b9b9b;
            line-height: 1.5;
        }
        .ai-ready-section span.bg-gray {
            background: rgba(255, 255, 255, 0.08);
            padding: 1px 6px;
            border-radius: 3px;
            color: #d0d0d0;
        }

        .visual-editor-icons {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 30px 0;
        }
        .icon-block-row {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }
        .icon-block {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-block svg {
            width: 24px;
            height: 24px;
            stroke: #a0a0a0;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .visual-editor-section {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
        }
        .visual-editor-section h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #fff;
        }
        .visual-editor-section p {
            font-size: 14px;
            color: #9b9b9b;
            line-height: 1.5;
        }

        @media (max-width: 1024px) {
            .hero { flex-direction: column; gap: 60px; padding: 40px 20px; align-items: flex-start; }
            .hero-content { max-width: 100%; }
            .code-wrapper { width: 100%; }
            .hero h1 { font-size: 3rem; }
            .features-grid { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="bg-dots"></div>
    <div class="glow-left"></div>
    <div class="glow-right"></div>

    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

</html>
