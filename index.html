<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #020202;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* ========================================================
           КРАСИВЫЙ ФОН С ФИОЛЕТОВЫМИ И ОРАНЖЕВЫМИ СВЕЧЕНИЯМИ
           ======================================================== */
        .glow-orange {
            position: fixed;
            bottom: -10vh;
            right: -10%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(255, 100, 50, 0.35) 0%, transparent 70%);
            filter: blur(120px);
            pointer-events: none;
            z-index: -1;
            animation: floatGlow 20s infinite alternate ease-in-out;
        }
        
        .glow-purple {
            position: fixed;
            top: -10vh;
            left: -10%;
            width: 60vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(130, 80, 255, 0.3) 0%, transparent 65%);
            filter: blur(100px);
            pointer-events: none;
            z-index: -1;
            animation: floatGlow 25s infinite alternate-reverse ease-in-out;
        }

        .glow-small-pink {
            position: fixed;
            bottom: 20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(200, 120, 255, 0.15) 0%, transparent 60%);
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
            animation: floatGlow 18s infinite alternate ease-in-out;
        }

        /* ✅ НОВОЕ СВЕЧЕНИЕ: Ещё один фиолетовый круг слева внизу */
        .glow-bottom-left {
            position: fixed;
            bottom: -15vh;
            left: -10%;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(130, 80, 255, 0.25) 0%, transparent 70%);
            filter: blur(90px);
            pointer-events: none;
            z-index: -1;
            animation: floatGlow 22s infinite alternate ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.3) translate(30px, -30px); opacity: 1; }
        }

        /* Тёмная вуаль */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 2, 0.4);
            pointer-events: none;
            z-index: 0;
        }

        /* ⭐ БОЛЬШЕ ТОЧЕК НА ФОНЕ */
        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 16px 16px, 32px 32px;
            background-position: 0 0, 8px 8px;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 8s infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ========================================================
           ОСНОВНОЙ ИНТЕРФЕЙС
           ======================================================== */
        #root {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .navbar-left { display: flex; align-items: center; }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
        }
        .logo img {
            width: 24px;
            height: 24px;
            display: block;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
            color: #ffffff;
        }
        .btn-primary { 
            background: rgba(130, 80, 255, 0.15); 
            border: 1px solid rgba(130, 80, 255, 0.3);
        }
        .btn-primary:hover { 
            background: #8A55F7; 
            color: #ffffff; 
            border-color: #8A55F7;
        }
        .btn-outline { 
            background: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .btn-outline:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: rgba(255, 255, 255, 0.3);
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 60px 30px;
            max-width: 1300px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            position: relative;
        }

        .hero-content {
            max-width: 50%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .badges { display: flex; align-items: center; gap: 10px; }
        .badge-new { 
            background: rgba(130, 80, 255, 0.2); 
            color: #8A55F7; 
            font-size: 10px; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            padding: 5px 12px; 
            border-radius: 4px; 
            border: 1px solid rgba(130, 80, 255, 0.2);
            text-transform: uppercase; 
        }
        .badge-link { 
            color: rgba(255, 255, 255, 0.5); 
            font-size: 12px; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }
        .badge-link:hover { color: #ffffff; }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
            text-shadow: 0 4px 40px rgba(130, 80, 255, 0.15);
        }
        .hero p { 
            font-size: 1.1rem; 
            line-height: 1.6; 
            color: rgba(255, 255, 255, 0.6); 
            max-width: 480px; 
        }
        
        .btn-browse {
            background: rgba(130, 80, 255, 0.15);
            color: #ffffff;
            font-size: 16px;
            padding: 12px 28px;
            border-radius: 8px;
            width: fit-content;
            font-weight: 500;
            border: 1px solid rgba(130, 80, 255, 0.2);
            transition: all 0.2s ease;
        }
        .btn-browse:hover { 
            background: #8A55F7; 
            border-color: #8A55F7;
            transform: scale(1.02); 
        }

        .code-wrapper {
            width: 45%;
            background: rgba(2, 2, 2, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(24px) saturate(120%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .code-header {
            background: rgba(30, 25, 40, 0.25);
            padding: 8px 16px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .code-controls { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .code-body {
            padding: 24px;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #e0e0e0;
            position: relative;
            overflow: hidden;
            background: transparent;
        }
        .kw { color: #c678dd; font-weight: 500; }
        .str { color: #98c379; }
        .func { color: #61afef; }
        .prop { color: #abb2bf; }
        .equal { color: #abb2bf; }
        .val { color: #56b6c2; }
        .code-indent-1 { padding-left: 16px; }
        .code-indent-2 { padding-left: 32px; }
        .code-indent-3 { padding-left: 48px; }
        .code-footer { padding: 8px 16px; text-align: right; font-size: 10px; color: rgba(255,255,255,0.15); border-top: 1px solid rgba(255, 255, 255, 0.03); }

        .features-grid {
            display: flex;
            gap: 24px;
            max-width: 1300px;
            margin: 30px auto 80px auto;
            padding: 0 30px;
            width: 100%;
        }
        .feature-card {
            flex: 1;
            background: rgba(2, 2, 2, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(4px);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .editor-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .editor-dots { display: flex; gap: 6px; }
        .editor-dots span { width: 8px; height: 8px; border-radius: 50%; background: #4a4a4a; }
        .editor-header-label { font-size: 13px; color: rgba(255,255,255,0.3); font-weight: 500; }
        .editor-prompt {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 10px 14px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .editor-prompt span:first-child { color: rgba(255,255,255,0.2); margin-right: 10px; }
        .editor-code-block {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #c5c5c5;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .editor-line { display: flex; gap: 14px; }
        .editor-line-num { color: #4a4a4a; min-width: 16px; text-align: right; user-select: none; }
        .editor-indent-1 { padding-left: 8px; }
        .editor-indent-2 { padding-left: 16px; }
        
        .ai-ready-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        .ai-ready-section h4 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #ffffff; }
        .ai-ready-section p { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.5; }
        .ai-ready-section span.bg-gray { background: rgba(255, 255, 255, 0.08); padding: 1px 6px; border-radius: 3px; color: #d0d0d0; }

        .visual-editor-icons { display: flex; flex-direction: column; align-items: center; padding: 20px 0 30px 0; }
        .icon-block-row { display: flex; gap: 16px; margin-top: 16px; }
        .icon-block { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; display: flex; justify-content: center; align-items: center; }
        .icon-block svg { width: 24px; height: 24px; stroke: rgba(255,255,255,0.2); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .visual-editor-section { border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 16px; }
        .visual-editor-section h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #ffffff; }
        .visual-editor-section p { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.5; }

        .custom-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            margin: 40px auto 100px auto;
            padding: 0 30px;
            width: 100%;
        }
        .custom-text { max-width: 50%; }
        .custom-text h2 {
            font-size: 3.5rem;
            line-height: 1.2;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .custom-image-wrapper { flex-shrink: 0; }
        .custom-image-wrapper img {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(130, 80, 255, 0.2);
            box-shadow: 0 0 60px rgba(130, 80, 255, 0.15);
        }

        @media (max-width: 1024px) {
            .hero { flex-direction: column; gap: 60px; padding: 40px 20px; align-items: flex-start; }
            .hero-content { max-width: 100%; }
            .code-wrapper { width: 100%; }
            .hero h1 { font-size: 3rem; }
            .features-grid { flex-direction: column; }
        }
        @media (max-width: 768px) {
            .custom-section { flex-direction: column; gap: 40px; text-align: center; margin: 40px auto 60px auto; }
            .custom-text { max-width: 100%; }
            .custom-text h2 { font-size: 2.2rem; }
            .custom-image-wrapper img { width: 200px; height: 200px; }
            .navbar { flex-direction: column; gap: 20px; }
            .navbar-right { width: 100%; justify-content: center; }
        }
    </style>
</head>
