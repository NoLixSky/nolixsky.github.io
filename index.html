<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at 50% 80%, #181818 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* САЙДБАР */
        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(4px);
            border-right: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #ffffff;
            margin-bottom: 20px;
            padding-left: 4px;
            text-transform: lowercase;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }
        .new-chat-btn:hover { 
            background-color: #2a2a2a; 
            border-color: #444;
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .chat-item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            color: #7a7a8a;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.04);
            color: #ffffff;
        }
        .chat-item.active {
            background-color: #2a2a2a;
            color: #ffffff;
        }

        .chat-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .dots-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .menu-dots {
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
            padding: 4px;
            border-radius: 6px;
        }
        .chat-item.active .menu-dots { opacity: 1; }
        .menu-dots:hover { background-color: rgba(255, 255, 255, 0.05); }
        
        .menu-dots svg {
            stroke: #888888;
            transition: stroke 0.2s;
        }
        .menu-dots:hover svg { stroke: #ffffff; }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background-color: #1f1f1f;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 130px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .dropdown-menu.open { display: block; }

        .dropdown-item {
            padding: 8px 16px;
            font-size: 13px;
            color: #d1d1d1;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .dropdown-item:hover {
            background-color: #2a2a2a;
            color: #ff6b6b;
        }

        /* ОСНОВНАЯ ОБЛАСТЬ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0 40px 40px 40px;
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: center;
            padding: 20px 0 10px 0;
        }
        .brand-name {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #ffffff;
            text-transform: lowercase;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }
        
        .greeting-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .greeting-text {
            font-size: 28px;
            font-weight: 400;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ДИЗАЙН СООБЩЕНИЙ */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        .message-wrapper.user { align-items: flex-end; }
        .message-wrapper.ai { align-items: flex-start; }

        .message-sender {
            font-size: 12px;
            font-weight: 500;
            color: #6a6a7a;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .message-wrapper.user .message-sender { text-align: right; width: 100%; }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .message.user {
            background: linear-gradient(135deg, #2e2e2e, #262626);
            color: #fff;
            border-radius: 20px 20px 4px 20px;
        }
        .message.ai {
            background: linear-gradient(135deg, #191919, #121212);
            color: #e5e5e5;
            border-radius: 20px 20px 20px 4px;
        }

        /* АНИМАЦИЯ ПЕЧАТАНИЯ ИИ */
        .typing-indicator {
            align-self: flex-start;
            background: #191919;
            padding: 12px 18px;
            border-radius: 20px 20px 20px 4px;
            display: flex;
            gap: 5px;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #666;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ПОЛЕ ВВОДА */
        .input-area {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            background-color: #1c1c1c;
            border-radius: 20px;
            padding: 8px 8px 8px 16px;
            display: flex;
            align-items: center;
            border: 1px solid #2a2a2a;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }
        .input-area:focus-within {
            background-color: #212121;
            border-color: #444444;
            box-shadow: 0 15px 45px rgba(255, 255, 255, 0.03);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            padding: 12px 0;
            width: 100%;
        }
        .input-field::placeholder { color: #666666; }

        .send-btn {
            width: 34px;
            height: 34px;
            background-color: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .send-btn:hover { background-color: #333333; }
        
        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #888888;
            stroke-width: 2;
            fill: none;
            transition: 0.3s;
        }
        .send-btn:hover svg { 
            stroke: #ffffff; 
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding: 0 15px 15px 15px; }
            .brand-name { font-size: 24px; }
            .greeting-text { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Сайдбар -->
    <div class="sidebar">
        <div class="sidebar-title">explow</div>
        <button class="new-chat-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14" />
            </svg>
            Новый чат
        </button>
        <div class="chat-history" id="chat-history"></div>
    </div>

    <!-- Основной экран -->
    <div class="main-content">
        <div class="header-area">
            <div class="brand-name">explow</div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="input-area">
            <input type="text" class="input-field" id="input-field" placeholder="Напишите ваш запрос...">
            <button class="send-btn" id="send-btn">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 4l1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
            let chats = {};
            let currentChatId = null;
            const STORAGE_KEY = 'explow_chat_data';
            const chatHistory = document.getElementById('chat-history');
            const messagesContainer = document.getElementById('messages-container');
            const inputField = document.getElementById('input-field');
            const sendBtn = document.getElementById('send-btn');
            const newChatBtn = document.getElementById('new-chat-btn');

            // 1. ЗАГРУЗКА И СОХРАНЕНИЕ (с защитой от краша)
            function loadChats() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (typeof parsed === 'object' && parsed !== null) {
                            chats = parsed;
                        }
                    }
                } catch (e) {
                    console.warn('Ошибка чтения localStorage, сброс данных:', e);
                    chats = {};
                }
            }

            function saveChats() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
                } catch (e) {
                    console.warn('Ошибка сохранения в localStorage:', e);
                }
            }

            // 2. ОБНОВЛЕНИЕ ЗАГОЛОВКА ЧАТА В МЕНЮ
            function updateChatTitle(chatId) {
                const items = document.querySelectorAll('.chat-item');
                const titleText = chats[chatId]?.find(m => m.type === 'user')?.text || 'Новый чат';
                const truncated = titleText.length > 25 ? titleText.substring(0, 25) + '...' : titleText;
                
                items.forEach(item => {
                    // Находим текстовый элемент внутри чата
                    const textSpan = item.querySelector('.chat-text');
                    // Проверяем, совпадает ли этот элемент с нужным ID (data-атрибута нет, поэтому ищем по индексу или контексту)
                    // Лучше использовать идентификатор через dataset
                });
                // Перерисовываем весь сайдбар для надежности
                renderSidebar();
            }

            // 3. ОТРИСОВКА МЕНЮ САЙДБАРА
            function renderSidebar() {
                chatHistory.innerHTML = '';
                const ids = Object.keys(chats);

                // Защита: если активного чата нет или он удален, переключаемся на первый доступный
                if (ids.length === 0) {
                    currentChatId = null;
                } else if (!currentChatId || !chats[currentChatId]) {
                    currentChatId = ids[0];
                }

                ids.forEach(id => {
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    if (id === currentChatId) chatItem.classList.add('active');

                    // Определяем заголовок
                    const messages = chats[id] || [];
                    let title = 'Новый чат';
                    if (messages.length > 0) {
                        const firstUserMsg = messages.find(m => m.type === 'user');
                        if (firstUserMsg) {
                            title = firstUserMsg.text.length > 25 ? firstUserMsg.text.substring(0, 25) + '...' : firstUserMsg.text;
                        }
                    }

                    const chatText = document.createElement('span');
                    chatText.className = 'chat-text';
                    chatText.innerText = title;
                    
                    const dotsWrapper = document.createElement('div');
                    dotsWrapper.className = 'dots-wrapper';
                    
                    const dots = document.createElement('span');
                    dots.className = 'menu-dots';
                    dots.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="1" />
                            <circle cx="19" cy="12" r="1" />
                            <circle cx="5" cy="12" r="1" />
                        </svg>
                    `;

                    const dropdown = document.createElement('div');
                    dropdown.className = 'dropdown-menu';
                    dropdown.innerHTML = `
                        <div class="dropdown-item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18"></path>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                            Удалить чат
                        </div>
                    `;

                    dotsWrapper.appendChild(dots);
                    dotsWrapper.appendChild(dropdown);
                    chatItem.appendChild(chatText);
                    chatItem.appendChild(dotsWrapper);
                    chatHistory.appendChild(chatItem);

                    // Клик по трем точкам
                    dots.addEventListener('click', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
                        dropdown.classList.toggle('open');
                    });

                    // Клик по чату (переключение)
                    chatItem.addEventListener('click', () => {
                        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                        chatItem.classList.add('active');
                        dropdown.classList.remove('open');
                        currentChatId = id;
                        renderMessages();
                    });

                    // Клик по удалению
                    const deleteBtn = dropdown.querySelector('.dropdown-item');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        delete chats[id];
                        saveChats();
                        renderSidebar();
                        renderMessages();
                    });
                });
            }

            // 4. ОТРИСОВКА СООБЩЕНИЙ
            function renderMessages() {
                messagesContainer.innerHTML = '';
                
                if (!currentChatId || !chats[currentChatId] || chats[currentChatId].length === 0) {
                    const greetingWrapper = document.createElement('div');
                    greetingWrapper.className = 'greeting-wrapper';
                    greetingWrapper.innerHTML = `<div class="greeting-text">Чем я могу вам помочь?</div>`;
                    messagesContainer.appendChild(greetingWrapper);
                    return;
                }

                const chatMessages = chats[currentChatId];
                chatMessages.forEach(msg => {
                    const wrapper = document.createElement('div');
                    wrapper.className = `message-wrapper ${msg.type}`;

                    const sender = document.createElement('div');
                    sender.className = 'message-sender';
                    sender.innerText = msg.type === 'user' ? 'Вы' : 'explow';
                    wrapper.appendChild(sender);

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.type}`;
                    msgDiv.innerText = msg.text;
                    wrapper.appendChild(msgDiv);

                    messagesContainer.appendChild(wrapper);
                });
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            // 5. ФУНКЦИЯ СОЗДАНИЯ НОВОГО ЧАТА
            function createNewChat() {
                const newId = 'chat_' + Date.now();
                chats[newId] = [];
                currentChatId = newId;
                saveChats();
                renderSidebar();
                renderMessages();
                inputField.focus();
            }

            // 6. ОТПРАВКА СООБЩЕНИЯ
            function addMessageToCurrentChat(type, text) {
                if (!currentChatId || !chats[currentChatId]) return;
                chats[currentChatId].push({ type, text });
                saveChats();
                renderMessages();
                renderSidebar(); // Обновляем заголовки в меню (например, первый запрос меняет название)
            }

            function addTypingIndicator() {
                const existing = document.getElementById('typing-wrapper');
                if(existing) existing.remove();

                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper ai';
                wrapper.id = 'typing-wrapper';
                
                const sender = document.createElement('div');
                sender.className = 'message-sender';
                sender.innerText = 'explow';
                wrapper.appendChild(sender);

                const indicator = document.createElement('div');
                indicator.className = 'typing-indicator';
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'typing-dot';
                    indicator.appendChild(dot);
                }
                wrapper.appendChild(indicator);
                messagesContainer.appendChild(wrapper);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function removeTypingIndicator() {
                const wrapper = document.getElementById('typing-wrapper');
                if (wrapper) wrapper.remove();
            }

            function handleSendMessage() {
                const text = inputField.value.trim();
                if (!text || !currentChatId) return;

                addMessageToCurrentChat('user', text);
                inputField.value = '';

                addTypingIndicator();

                // Эмуляция ответа ИИ (В следующий раз заменим на fetch к Groq)
                setTimeout(() => {
                    removeTypingIndicator();
                    const aiText = "Отлично! Чат работает, и история сохраняется в твоем браузере. Можешь создать новый чат и писать там, не боясь, что переписка перемешается.";
                    addMessageToCurrentChat('ai', aiText);
                }, 1200);
            }

            // 7. ИНИЦИАЛИЗАЦИЯ
            loadChats();
            if (Object.keys(chats).length === 0) {
                createNewChat();
            } else {
                const ids = Object.keys(chats);
                currentChatId = ids[0];
                renderSidebar();
                renderMessages();
            }

            // 8. ОБРАБОТЧИКИ СОБЫТИЙ
            newChatBtn.addEventListener('click', createNewChat);
            sendBtn.addEventListener('click', handleSendMessage);
            inputField.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSendMessage();
            });
        });
    </script>
</body>
</html>
