<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <!-- Подключаем внешний CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="mobile-close" onclick="document.getElementById('sidebar').classList.remove('open')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <button class="new-chat-btn" onclick="resetChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Новый чат</span>
            <span>Ctrl K</span>
        </button>

        <div class="nav-category">Разделы</div>
        <div class="nav-item" onclick="setPlaceholder('Плагины')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg> Плагины</div>
        <div class="nav-item" onclick="setPlaceholder('Задачи')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Задачи по расписанию</div>
        <div class="nav-item" onclick="setPlaceholder('Кластер')"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> Кластер</div>
        <div class="nav-item" onclick="setPlaceholder('Слайды')"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> Слайды</div>
        <div class="nav-item" onclick="setPlaceholder('Исследование')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg> Глубокое исследование</div>
        <div class="nav-item" onclick="setPlaceholder('Сайты')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Сайты</div>
        <div class="nav-item" onclick="setPlaceholder('Документы')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Документы</div>
        <div class="nav-item" onclick="setPlaceholder('Таблицы')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="21" x2="9" y2="9"/><line x1="15" y1="21" x2="15" y2="9"/></svg> Таблицы</div>

        <div class="nav-category">Проекты</div>
        <div class="nav-item" onclick="setPlaceholder('Explow Code')"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Explow Code</div>
        <div class="nav-item" onclick="setPlaceholder('Explow Work')"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Explow Work</div>

        <div class="sidebar-divider"></div>
        <div class="recent-chats-header">Чаты</div>
        <div id="recent-chats-list"></div>

        <div class="sidebar-footer" id="sidebar-footer">
            <div class="profile-avatar" id="profile-avatar">E</div>
            <div class="profile-info">
                <div class="profile-name" id="profile-name">Explow User</div>
                <div class="profile-sub">Аккаунт</div>
            </div>
        </div>
    </div>

    <!-- ================= ОСНОВНАЯ ОБЛАСТЬ ================= -->
    <div class="main-wrapper">
        
        <!-- ЛОГОТИП И БЫСТРЫЕ ДЕЙСТВИЯ -->
        <div id="main-content">
            <div class="main-logo" id="main-logo">explow</div>
            <div class="quick-actions">
                <div class="quick-pill" onclick="setPlaceholder('Кластер')"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> Кластер</div>
                <div class="quick-pill" onclick="setPlaceholder('Слайды')"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> Слайды</div>
                <div class="quick-pill" onclick="setPlaceholder('Глубокое исследование')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg> Глубокое исследование</div>
                <div class="quick-pill" onclick="setPlaceholder('Сайты')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Сайты</div>
                <div class="quick-pill" onclick="setPlaceholder('Документы')"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Документы</div>
            </div>
        </div>

        <!-- ЧАТ -->
        <div id="chat-area"></div>

        <!-- ПОЛЕ ВВОДА (всегда внизу) -->
        <div class="input-wrapper" id="input-wrapper">
            <div class="input-top">
                <button class="attach-btn" onclick="document.getElementById('file-input').click()">
                    <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">
                <textarea id="input-field" placeholder="Введите запрос..." rows="1"></textarea>
            </div>
            
            <div class="input-bottom">
                <div class="model-selector" id="model-selector" onclick="toggleModel()">
                    <span id="model-fast" class="active-model">Быстрый</span>
                    <span style="color:#444; font-size:11px;">/</span>
                    <span id="model-expert" class="inactive-model">Высокий</span>
                    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <button class="send-btn" id="send-btn">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Подключаем Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Подключаем внешний JS -->
    <script src="script.js"></script>
</body>
</html>
