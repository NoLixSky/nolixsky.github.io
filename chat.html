<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000000; color: #e0e0e0; font-family: 'Inter', sans-serif; height: 100vh; display: flex; overflow: hidden; }

        /* ================= САЙДБАР ================= */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: #000000;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            padding: 16px;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .sidebar-header {
            display: none;
            justify-content: flex-end;
            padding-bottom: 8px;
        }
        .mobile-close {
            background: transparent;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 14px;
            background: #1c1c1c;
            border: none;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .new-chat-btn:hover { background: #2a2a2a; }
        .new-chat-btn span:last-child { color: rgba(255, 255, 255, 0.3); font-weight: 400; font-size: 12px; }
        .new-chat-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        .nav-category {
            font-size: 11px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            margin: 16px 0 8px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
        .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

        .sidebar-divider { height: 1px; background: rgba(255, 255, 255, 0.04); margin: 8px 0; }

        .recent-chats-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            margin: 16px 0 8px 8px;
            text-transform: uppercase;
        }
        #recent-chats-list { flex: 1; overflow-y: auto; }
        #recent-chats-list::-webkit-scrollbar { width: 4px; }
        #recent-chats-list::-webkit-scrollbar-track { background: transparent; }
        #recent-chats-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .recent-chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .recent-chat-item:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
        .recent-chat-item .chat-time { color: rgba(255, 255, 255, 0.2); font-size: 11px; }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 8px;
            margin-top: 8px;
        }
        .sidebar-footer:hover { background: rgba(255, 255, 255, 0.04); }
        .profile-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
        }
        .profile-info { flex: 1; }
        .profile-name { font-size: 13px; font-weight: 500; color: #e0e0e0; }
        .profile-sub { font-size: 11px; color: rgba(255,255,255,0.3); }

        /* ================= ОСНОВНОЙ КОНТЕНТ ================= */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 40px 20px 40px;
            position: relative;
            width: 100%;
        }

        .main-logo {
            font-size: 64px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 24px;
            text-shadow: 0 0 60px rgba(255,255,255,0.03);
        }

        .input-wrapper {
            width: 100%;
            max-width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 8px 12px 8px 16px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-top { display: flex; align-items: center; gap: 12px; }
        .input-top textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            resize: none;
            height: 24px;
            min-height: 24px;
            padding: 0;
        }
        .input-top textarea::placeholder { color: rgba(255, 255, 255, 0.2); }
        .attach-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.3); cursor: pointer; transition: 0.2s;
        }
        .attach-btn:hover { color: #fff; }
        .attach-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        #file-input { display: none; }

        .input-bottom {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 4px;
            gap: 12px;
        }
        .model-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #999999;
            cursor: pointer;
            transition: 0.2s;
            background: #1c1c1c;
            padding: 4px 12px 4px 14px;
            border-radius: 30px;
            border: 1px solid #2a2a2a;
        }
        .model-selector:hover { color: #ffffff; border-color: #444444; }
        .model-selector svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
        .model-selector .active-model { color: #ffffff; font-weight: 500; }
        .model-selector .inactive-model { color: #666666; }

        .send-btn {
            background: transparent; border: none; border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; color: rgba(255, 255, 255, 0.3);
        }
        .send-btn:hover { color: #fff; }
        .send-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
            width: 100%;
            max-width: 900px;
            justify-content: flex-start;
        }
        .quick-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-pill:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
        .quick-pill svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }

        /* ================= ЧАТ (С ЧУТЬ МЕНЬШЕЙ ШИРИНОЙ) ================= */
        #chat-area {
            display: none;
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 20px 0 20px 0;
            flex-direction: column;
            gap: 24px;
        }
        #chat-area.active { display: flex; }
        #chat-area::-webkit-scrollbar { width: 4px; }
        #chat-area::-webkit-scrollbar-track { background: transparent; }
        #chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }
        .message-wrapper.user { align-items: flex-end; margin-bottom: 4px; }
        .message-wrapper.ai { align-items: flex-start; margin-bottom: 0; }

        .message-sender { font-size: 12px; color: rgba(255,255,255,0.3); margin-bottom: 6px; padding-left: 4px; }
        .message-wrapper.user .message-sender { text-align: right; padding-right: 4px; }

        /* ✅ ШИРИНА СООБЩЕНИЙ: 85% (как было), но с ограничением 800px */
        .message {
            max-width: 85%;
            max-width: 800px; /* Ограничиваем ширину, чтобы на больших экранах было красиво */
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .message.user {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Для AI-карточек та же логика ширины */
        .message.ai {
            background: transparent;
            border: none;
            padding: 0;
            max-width: 85%;
            max-width: 800px;
            width: 100%;
        }

        .ai-card {
            background: #151515;
            border: 1px solid #222222;
            border-radius: 16px;
            padding: 20px 24px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .ai-avatar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }
        .ai-name { font-size: 14px; font-weight: 500; color: #e0e0e0; }

        .ai-content {
            font-size: 15px;
            line-height: 1.6;
            color: #d0d0d0;
            padding-left: 0;
        }

        .ai-content .code-block-wrapper {
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #0a0a0a;
            overflow: hidden;
            margin-top: 12px;
        }
        .ai-content .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: #111111;
            border-bottom: 1px solid #222222;
        }
        .ai-content .code-lang { font-size: 12px; font-weight: 500; color: #8ab4f8; text-transform: uppercase; }
        .ai-content .copy-btn {
            background: transparent; border: none; color: #888888; cursor: pointer; font-size: 11px; transition: 0.2s;
        }
        .ai-content .copy-btn:hover { color: #fff; }
        .ai-content .code-block-wrapper pre { margin: 0 !important; padding: 16px !important; background: #0a0a0a !important; border-radius: 0 !important; border: none !important; }
        .ai-content .code-block-wrapper code { font-family: 'Courier New', monospace; font-size: 14px; }

        .ai-actions {
            display: flex;
            justify-content: flex-end;
            padding-top: 12px;
            border-top: 1px solid #222222;
            margin-top: 4px;
        }
        .ai-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            color: #666666;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .ai-action-btn:hover { color: #e0e0e0; }
        .ai-action-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

        .message.user .image-preview {
            margin-top: 8px;
            border-radius: 8px;
            max-width: 300px;
            max-height: 200px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= АДАПТИВНОСТЬ ================= */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                transition: 0.3s;
                z-index: 20;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-header { display: flex; }
            .main-logo { font-size: 48px; }
            .quick-actions { justify-content: flex-start; gap: 6px; flex-wrap: wrap; }
            .quick-pill { padding: 6px 10px; font-size: 12px; }
            .main-content { padding: 20px 20px; }
            #chat-area { padding: 20px 0; }
            .ai-card { padding: 16px; }
            /* На мобильных убираем ограничение, чтобы текст читался комфортно */
            .message { max-width: 95%; }
            .message.ai { max-width: 95%; }
        }
        @media (min-width: 769px) and (max-width: 1400px) {
            .message { max-width: 90%; }
            .message.ai { max-width: 90%; }
        }
    </style>
</head>

        <div class="sidebar-header">
            <button class="mobile-close" onclick="document.getElementById('sidebar').classList.remove('open')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        <button class="new-chat-btn" onclick="resetChat()">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        // Универсальная функция копирования
        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const orig = btn.innerHTML;
                btn.innerHTML = '✅ Скопировано';
                setTimeout(() => btn.innerHTML = orig, 2000);
            } catch (err) {
                console.error('Ошибка копирования', err);
            }
            document.body.removeChild(textarea);
        }

        window.copyToClipboard = function(btn, text) {
            if (!text) {
                const card = btn.closest('.ai-card');
                const contentEl = card.querySelector('.ai-content');
                text = contentEl.innerText;
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    const orig = btn.innerHTML;
                    btn.innerHTML = '✅ Скопировано';
                    setTimeout(() => btn.innerHTML = orig, 2000);
                }).catch(() => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            console.log("✅ Чат загружен!");

            const chatArea = document.getElementById('chat-area');
            const inputField = document.getElementById('input-field');
            const sendBtn = document.getElementById('send-btn');
            const modelFast = document.getElementById('model-fast');
            const modelExpert = document.getElementById('model-expert');
            const recentChatsList = document.getElementById('recent-chats-list');
            const mainContainer = document.getElementById('main-content');

            let currentModel = 'Быстрый';
            let isChatActive = false;
            let recentChats = [];

            // ЗАГРУЗКА ПРОФИЛЯ ИЗ LOCALSTORAGE
            const savedUser = localStorage.getItem('explow_user');
            if (savedUser) {
                try {
                    const userData = JSON.parse(savedUser);
                    document.getElementById('profile-name').textContent = userData.username || 'Explow User';
                    const avatarLetter = userData.avatar || (userData.username ? userData.username.charAt(0).toUpperCase() : 'E');
                    document.getElementById('profile-avatar').textContent = avatarLetter;
                } catch(e) { console.log("Ошибка загрузки профиля"); }
            }

            window.resetChat = function() {
                chatArea.innerHTML = '';
                chatArea.classList.remove('active');
                mainContainer.style.display = 'flex';
                isChatActive = false;
                inputField.value = '';
                inputField.placeholder = 'Введите запрос...';

                const now = new Date();
                const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const title = `Чат ${recentChats.length + 1}`;
                recentChats.unshift({ title: title, time: timeStr });
                renderRecentChats();
            };

            function renderRecentChats() {
                recentChatsList.innerHTML = '';
                recentChats.slice(0, 10).forEach(chat => {
                    const el = document.createElement('div');
                    el.className = 'recent-chat-item';
                    el.innerHTML = `<span>${chat.title}</span> <span class="chat-time">${chat.time}</span>`;
                    el.onclick = () => { inputField.focus(); };
                    recentChatsList.appendChild(el);
                });
            }

            window.setPlaceholder = function(section) {
                inputField.placeholder = `Спросите про ${section}...`;
                inputField.focus();
            };

            window.toggleModel = function() {
                if (currentModel === 'Быстрый') {
                    currentModel = 'Высокий';
                    modelFast.className = 'inactive-model';
                    modelExpert.className = 'active-model';
                } else {
                    currentModel = 'Быстрый';
                    modelFast.className = 'active-model';
                    modelExpert.className = 'inactive-model';
                }
            };

            window.handleImageUpload = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (!isChatActive) {
                        mainContainer.style.display = 'none';
                        chatArea.classList.add('active');
                        isChatActive = true;
                    }
                    const wrapper = document.createElement('div');
                    wrapper.className = 'message-wrapper user';
                    const sender = document.createElement('div');
                    sender.className = 'message-sender';
                    sender.textContent = 'Вы';
                    wrapper.appendChild(sender);
                    const msg = document.createElement('div');
                    msg.className = 'message user';
                    msg.innerHTML = `
                        <img src="${e.target.result}" class="image-preview" alt="Загруженное фото">
                        <div style="margin-top:6px;font-size:12px;color:rgba(255,255,255,0.4);">📷 Изображение прикреплено</div>
                    `;
                    wrapper.appendChild(msg);
                    chatArea.appendChild(wrapper);
                    chatArea.scrollTop = chatArea.scrollHeight;
                };
                reader.readAsDataURL(file);
                event.target.value = ''; 
            };

            function formatMessageContent(text) {
                text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const parts = text.split(/(```[\s\S]*?```)/g);
                let html = '';
                parts.forEach(part => {
                    const match = part.match(/```(\w*)\n([\s\S]*?)```/);
                    if (match) {
                        const lang = match[1] || 'plaintext';
                        const code = match[2];
                        const displayLang = lang === 'javascript' ? 'JavaScript' : lang.toUpperCase();
                        html += `
                        <div class="code-block-wrapper">
                            <div class="code-header">
                                <span class="code-lang">${displayLang}</span>
                                <button class="copy-btn" onclick="copyToClipboard(this)">📋 Копировать</button>
                            </div>
                            <pre><code class="language-${lang}">${code}</code></pre>
                        </div>`;
                    } else {
                        html += part.replace(/\n/g, '<br>');
                    }
                });
                return html;
            }

            function addMessage(type, text) {
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${type}`;
                const sender = document.createElement('div');
                sender.className = 'message-sender';
                sender.textContent = type === 'user' ? 'Вы' : 'explow';
                wrapper.appendChild(sender);

                if (type === 'user') {
                    const msg = document.createElement('div');
                    msg.className = `message ${type}`;
                    msg.textContent = text;
                    wrapper.appendChild(msg);
                } else {
                    const card = document.createElement('div');
                    card.className = 'ai-card';
                    
                    const avatarRow = document.createElement('div');
                    avatarRow.className = 'ai-avatar-row';
                    avatarRow.innerHTML = `
                        <div class="ai-avatar">E</div>
                        <div class="ai-name">explow</div>
                    `;
                    card.appendChild(avatarRow);

                    const content = document.createElement('div');
                    content.className = 'ai-content';
                    content.innerHTML = formatMessageContent(text);
                    card.appendChild(content);

                    const actions = document.createElement('div');
                    actions.className = 'ai-actions';
                    actions.innerHTML = `
                        <button class="ai-action-btn" onclick="copyToClipboard(this)">
                            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            Копировать
                        </button>
                    `;
                    card.appendChild(actions);
                    wrapper.appendChild(card);
                }

                chatArea.appendChild(wrapper);
                chatArea.scrollTop = chatArea.scrollHeight;

                if (type === 'ai') {
                    chatArea.querySelectorAll('.ai-content pre code').forEach(block => hljs.highlightElement(block));
                }
            }

            function handleSend() {
                const text = inputField.value.trim();
                if (!text) return;

                if (!isChatActive) {
                    mainContainer.style.display = 'none';
                    chatArea.classList.add('active');
                    isChatActive = true;
                }

                addMessage('user', text);
                inputField.value = '';
                inputField.style.height = '24px';

                setTimeout(() => {
                    const model = currentModel === 'Быстрый' ? 'быстрой' : 'экспертной';
                    const demoReply = `Ответ от ${model} модели.\n\nВаш запрос: "${text}"\n\n\`\`\`javascript\n// Пример кода\nconsole.log("Привет из EXPLOW!");\n\`\`\``;
                    addMessage('ai', demoReply);
                }, 800);
            }

            sendBtn.addEventListener('click', handleSend);
            inputField.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });
            inputField.addEventListener('input', () => {
                inputField.style.height = '24px';
                inputField.style.height = inputField.scrollHeight + 'px';
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    resetChat();
                }
            });

            resetChat();
        });
    </script>
</body>
</html>
</html>
